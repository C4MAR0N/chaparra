name: Desplegar en GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # GitHub no dispara workflows con los commits que hace el propio GITHUB_TOKEN:
  # es su proteccion contra bucles infinitos. Sin esto, la prevision de AEMET se
  # guardaba en el repositorio cuatro veces al dia y no se publicaba nunca, asi
  # que la app seguia sirviendo la del ultimo empujon hecho a mano.
  workflow_run:
    workflows: ['Previsión de AEMET']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run tambien salta cuando la prevision ha fallado, y entonces no
    # hay nada nuevo que publicar.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar formato
        run: npm run format:check

      - name: Pruebas
        run: npm test

      # Con dominio propio la app cuelga de la raiz, no de /chaparra/
      - name: Compilar
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
